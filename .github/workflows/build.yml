name: Runner CI

on:
  workflow_dispatch:
  push:
    branches:
    - main
    - releases/*
    paths-ignore:
    - '**.md'
  pull_request:
    branches:
    - '**'
    paths-ignore:
    - '**.md'

jobs:
  build:
    strategy:
      matrix:
        # TEMP(fork-test): only build riscv64 until native hardware is in the
        # Canonical self-hosted pool. Revert to the full arch list before sending
        # the patch upstream.
        runtime: [ linux-riscv64 ]
        include:

        - runtime: linux-riscv64
          runs_on: riscv64
          patch_tag: riscv64
          dotnet_snap: dotnet-sdk-riscv

    runs-on: [ self-hosted, noble, "${{ matrix.runs_on }}" ]
    steps:
    - uses: actions/checkout@v4

    - name: Install DotNet SDK
      if: matrix.dotnet_snap == ''
      run: sudo apt-get update && sudo apt-get install -y dotnet-sdk-8.0

    - name: Install DotNet SDK (riscv64 snap)
      if: matrix.dotnet_snap != ''
      run: |
        # TEMP(fork-test): the dotnet-sdk-riscv snap is not on the Snap Store
        # yet, so download it from a temporary host and install with
        # --dangerous. Once published to the store, revert to:
        #   sudo snap install ${{ matrix.dotnet_snap }} --classic
        wget -q "https://vhaudiquet.fr/public/dotnet-riscv/dotnet-sdk-riscv_8.0.101_riscv64.snap" -O /tmp/dotnet-sdk-riscv.snap
        sudo snap install /tmp/dotnet-sdk-riscv.snap --dangerous --classic
        echo "DOTNET_ROOT=/snap/${{ matrix.dotnet_snap }}/current/dotnet" >> $GITHUB_ENV
        echo "/snap/${{ matrix.dotnet_snap }}/current/dotnet" >> $GITHUB_PATH

    - name: Apply patches
      if: matrix.runtime == 'linux-s390x' || matrix.runtime == 'linux-ppc64le' || matrix.runtime == 'linux-riscv64'
      run: |
        git apply patches/runner-main-sdk8-${{ matrix.patch_tag }}.patch

    - name: Update DotNet required version pin
      if: matrix.dotnet_snap == ''
      run: |
        sed -i "s/$( cat src/global.json | jq -r '.sdk.version' )/8.0/" src/global.json

    - name: Update DotNet required version pin (riscv64 snap)
      if: matrix.dotnet_snap != ''
      run: |
        # Pin global.json to the exact SDK version provided by the snap, since
        # the riscv64 .NET SDK is only available via the snap (no apt/PPA build).
        SDK_VERSION=$(dotnet --version)
        echo "Pinning global.json to SDK $SDK_VERSION"
        jq --arg v "$SDK_VERSION" '.sdk.version = $v' src/global.json > src/global.json.tmp && mv src/global.json.tmp src/global.json

    # Build runner layout
    - name: Build & Layout Release
      run: |
        ./dev.sh layout Release ${{ matrix.runtime }}
      working-directory: src

    # Run tests
    - name: L0
      run: |
        ./dev.sh test
      working-directory: src
      if: matrix.runtime == 'arm64' || matrix.runtime == 'amd64'

    # Create runner package tar.gz/zip
    - name: Package Release
      if: github.event_name != 'pull_request'
      run: |
        ./dev.sh package Release ${{ matrix.runtime }}
      working-directory: src

    - name: Test package
      if: github.event_name != 'pull_request'
      run: |
        mkdir package_test
        tar -xvzf ../_package/*.tar.gz -C package_test
        ./package_test/config.sh --version
      working-directory: src
        

    # Upload runner package tar.gz/zip as artifact
    - name: Publish Artifact
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: runner-package-${{ matrix.runtime }}
        path: |
          _package

    - uses: mattermost/action-mattermost-notify@master
      if: ${{ failure() }}
      with:
        MATTERMOST_WEBHOOK_URL: ${{ secrets.MM_WEBHOOK_URL }}
        TEXT: |
          ${{ github.repository }} build failed.
          [Pipeline](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) was failed :red_circle:
          ${{ secrets.MM_PING_USERS }}
        MATTERMOST_USERNAME: ${{ github.triggering_actor }}
        MATTERMOST_ICON_URL: https://cdn-icons-png.flaticon.com/512/25/25231.png
